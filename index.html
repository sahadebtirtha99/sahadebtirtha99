<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debtirtha Saha's Website</title>

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;

            /* 🌈 Background (dark default) */
            background: linear-gradient(-45deg, #111, #1a1a2e, #16213e, #111);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: white;
        }

        /* 🌈 BORDER */
        .wrapper {
            padding: 3px;
            border-radius: 22px;
            background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
            background-size: 600% 600%;
            animation: gradientMove 6s ease infinite;
            max-width: 520px;
            margin: auto;
        }

        /* GLASS */
        .container {
            position: relative;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1, p {
            color: white;
        }

        /* TOGGLE BUTTON */
        .toggle-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            border: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        /* PROFILE */
        .profile img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin: 15px 0;
        }

        /* BUTTONS */
        .btn {
            display: block;
            margin: 10px auto;
            padding: 12px;
            width: 85%;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }

        .note {
            font-size: 12px;
            color: #ffaaaa;
        }

        .footer {
            color: #ccc;
        }

        .qr img {
            width: 200px;
            border-radius: 15px;
            border: 2px solid white;
        }

        /* LIGHT MODE */
        .light body {
            background: #ffffff;
            color: black;
        }

        .light .container {
            background: rgba(255,255,255,0.7);
        }

        .light h1,
        .light p {
            color: black;
        }

        .light .btn {
            background: rgba(0,0,0,0.05);
            color: black;
        }

        /* ANIMATION */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>

<body>

<div class="wrapper">
    <div class="container">

        <!-- TOGGLE -->
        <button id="themeToggle" class="toggle-btn">☀️</button>

        <h1>Debtirtha Saha</h1>

        <div class="profile">
            <img src="profile.jpeg" alt="Profile">
        </div>

        <p><b>Follow me:</b></p>

        <a class="btn" href="https://www.facebook.com/Debtirtha2008" target="_blank">
            <i class="fab fa-facebook"></i> Facebook
        </a>

        <a class="btn" href="https://www.facebook.com/profile.php?id=61573991201154" target="_blank">
            <i class="fab fa-facebook"></i> Facebook Page
        </a>

        <a class="btn" href="https://x.com/Debtirtha_Saha" target="_blank">
            <i class="fab fa-x-twitter"></i> Twitter (X)
        </a>

        <a class="btn" href="https://www.instagram.com/d_e_b_t_i_r_t_h_a" target="_blank">
            <i class="fab fa-instagram"></i> Instagram
        </a>

        <a class="btn" href="https://www.snapchat.com/add/debtirtha_saha" target="_blank">
            <i class="fab fa-snapchat"></i> Snapchat
        </a>

        <a class="btn" href="https://wa.me/919474842412" target="_blank">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>

        <a class="btn" href="mailto:sahadebtirtha99@gmail.com">
            <i class="fas fa-envelope"></i> Gmail
        </a>

        <p class="note">If WhatsApp doesn't open, save number and chat</p>

        <div class="qr">
            <p><b>Scan QR Code:</b></p>
            <img src="qr-code.png" alt="QR">
        </div>

        <div class="footer">
            Thank you for visiting!!
        </div>

    </div>
</div>

<script>
const toggle = document.getElementById("themeToggle");

// Load saved theme OR default dark
if(localStorage.getItem("theme") === "light"){
    document.documentElement.classList.remove("dark");
    document.documentElement.classList.add("light");
    toggle.textContent = "🌙";
} else {
    document.documentElement.classList.add("dark");
    toggle.textContent = "☀️";
}

toggle.addEventListener("click", () => {
    if(document.documentElement.classList.contains("dark")){
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        localStorage.setItem("theme", "light");
        toggle.textContent = "🌙";
    } else {
        document.documentElement.classList.remove("light");
        document.documentElement.classList.add("dark");
        localStorage.setItem("theme", "dark");
        toggle.textContent = "☀️";
    }
});
</script>

</body>
</html>
