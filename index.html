    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            text-align: center;
            padding: 40px;
            animation: fadeIn 1s ease-in;
        }

        /* 🔵 BACKGROUND ANIMATION */
        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .background span {
            position: absolute;
            display: block;
            background: rgba(0, 0, 0, 0.08);
            animation: move 20s linear infinite;
            border-radius: 50%;
        }

        .background span:nth-child(1) { left: 10%; width: 25px; height: 25px; animation-duration: 15s; }
        .background span:nth-child(2) { left: 30%; width: 20px; height: 20px; animation-duration: 18s; }
        .background span:nth-child(3) { left: 50%; width: 30px; height: 30px; animation-duration: 12s; }
        .background span:nth-child(4) { left: 70%; width: 22px; height: 22px; animation-duration: 20s; }
        .background span:nth-child(5) { left: 85%; width: 18px; height: 18px; animation-duration: 16s; }
        .background span:nth-child(6) { left: 95%; width: 20px; height: 20px; animation-duration: 22s; }

        @keyframes move {
            0% { top: 100%; }
            100% { top: -10%; }
        }

        /* 🌈 GRADIENT BORDER */
        .wrapper {
            padding: 3px;
            border-radius: 22px;
            background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffcc, #ffcc00);
            background-size: 600% 600%;
            animation: gradientMove 6s ease infinite;
            max-width: 520px;
            margin: auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.2);
        }

        /* GLASS CONTAINER */
        .container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        h1 {
            color: black;
            font-family: cursive;
        }

        p {
            color: black;
        }

        /* PROFILE */
        .profile img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid black;
            object-fit: cover;
            margin: 15px 0;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            transition: transform 0.4s;
        }

        .profile img:hover {
            transform: scale(1.08);
        }

        /* BUTTONS */
        .btn {
            display: block;
            margin: 10px auto;
            padding: 12px;
            width: 85%;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.05);
            color: black;
            text-decoration: none;
            font-weight: bold;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .btn i {
            margin-right: 8px;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }

        .note {
            font-size: 12px;
            color: red;
        }

        .footer {
            margin-top: 20px;
            color: gray;
            font-style: italic;
        }

        /* QR */
        .qr img {
            width: 200px;
            border-radius: 15px;
            margin-top: 15px;
            border: 2px solid black;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

    </style>
</head>
